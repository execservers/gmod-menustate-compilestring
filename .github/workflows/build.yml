name: Build x86/x64 DLLs, injectors, and auto-release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dll:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Win32
            bits: '32'
            mode: default
            stdout: 'OFF'
            dll: menustate_compilestring_win32.dll
          - arch: x64
            bits: '64'
            mode: default
            stdout: 'OFF'
            dll: menustate_compilestring_win64.dll
          - arch: Win32
            bits: '32'
            mode: stdout
            stdout: 'ON'
            dll: menustate_compilestring_stdout_win32.dll
          - arch: x64
            bits: '64'
            mode: stdout
            stdout: 'ON'
            dll: menustate_compilestring_stdout_win64.dll
    steps:
      - uses: actions/checkout@v4
      - name: Configure ${{ matrix.arch }} / ${{ matrix.mode }}
        run: cmake -S . -B build -A ${{ matrix.arch }} -DMENUSTATE_COMPILESTRING_STDOUT=${{ matrix.stdout }}
      - name: Build DLL
        run: cmake --build build --config Release --parallel
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: menustate-compilestring-${{ matrix.mode }}-win${{ matrix.bits }}
          path: build/Release/${{ matrix.dll }}
          if-no-files-found: error

  tls-pins:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.collect.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/injector/go.mod
      - name: Collect CA-verified GitHub SPKI pins (all required hosts)
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          pins="$(go run scripts/collect-github-pins.go)"
          test -n "$pins"
          printf "value=%s\n" "$pins" >> "$GITHUB_OUTPUT"

  injector:
    needs: [dll, tls-pins]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - bits: '32'
            goarch: '386'
            dll: menustate_compilestring_win32.dll
            output: injector_win32.exe
          - bits: '64'
            goarch: 'amd64'
            dll: menustate_compilestring_win64.dll
            output: injector_win64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/injector/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: menustate-compilestring-default-win${{ matrix.bits }}
          path: cmd/injector/payload
      - name: Embed DLL and cross-compile Go console EXE
        working-directory: cmd/injector
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          REPOSITORY: execservers/gmod-menustate-compilestring
          TLS_PINS: ${{ needs.tls-pins.outputs.value }}
          OUTPUT_NAME: ${{ matrix.output }}
        run: |
          Move-Item "payload/${{ matrix.dll }}" "payload/menustate_compilestring.dll"
          $tag = "commit-" + $env:GITHUB_SHA.Substring(0, 12)
          $flags = "-X main.repository=$env:REPOSITORY -X main.buildVersion=$tag"
          if ($env:TLS_PINS) { $flags += " -X main.tlsSPKIPins=$env:TLS_PINS" }
          go build -trimpath -ldflags "$flags" -o $env:OUTPUT_NAME .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload injector
        uses: actions/upload-artifact@v4
        with:
          name: menustate-compilestring-injector-win${{ matrix.bits }}
          path: cmd/injector/${{ matrix.output }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [dll, injector]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: menustate-compilestring-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: menustate-compilestring-*
          path: dist
          merge-multiple: true
      - name: Verify release contents
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            menustate_compilestring_win32.dll \
            menustate_compilestring_win64.dll \
            menustate_compilestring_stdout_win32.dll \
            menustate_compilestring_stdout_win64.dll \
            injector_win32.exe \
            injector_win64.exe; do
            test -s "dist/$file"
          done
      - name: Publish release and update Latest for default branch HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag="commit-${GITHUB_SHA:0:12}"
          latest="false"
          if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            head="$(gh api "repos/${GH_REPO}/branches/${DEFAULT_BRANCH}" --jq '.commit.sha')"
            if [[ "$head" == "$GITHUB_SHA" ]]; then latest="true"; fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists (assets are immutable)."
            if [[ "$latest" == "true" ]]; then gh release edit "$tag" --latest; fi
          else
            gh release create "$tag" dist/*.dll dist/*.exe \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "Automated x86/x64 DLLs (normal/stdout) and injectors for $GITHUB_SHA" \
              --latest="$latest"
          fi
