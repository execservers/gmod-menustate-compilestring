name: Build Windows DLLs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Win32
            bits: 32
          - arch: x64
            bits: 64
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: menustate-compilestring-win${{ matrix.bits }}
          path: build/Release/menustate_compilestring_win${{ matrix.bits }}.dll
          if-no-files-found: error
